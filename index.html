<style>
:root{--blue:#1d9bf0;--blue2:#1d9bf0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:#fff;color:#000;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;display:flex;flex-direction:column;align-items:center}
main{width:100%;max-width:500px;padding:48px 20px 24px;flex:1;text-align:center}
.av{position:relative;width:128px;height:128px;margin:0 auto 24px}
.av .track,.av .ld{position:absolute;border-radius:50%;inset:-10px}
.av .track{border:4px solid rgba(29,155,240,.14)}
.av .ld{background:conic-gradient(from 0deg,rgba(29,155,240,0) 0%,#1d9bf0 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));animation:spin 3.6s linear infinite;will-change:transform;backface-visibility:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;background:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
h1{margin:0;font-size:1.65rem;letter-spacing:.12em;font-weight:800;color:#000;display:block;text-align:center}.nm{position:relative;display:inline-block;padding-left:.12em}
h1 svg{position:absolute;left:100%;top:50%;width:22px;height:22px;margin:-11px 0 0 4px}
.bio{margin:8px 0 30px;color:#000;opacity:.7;font-size:1rem}
#links{display:flex;flex-direction:column;gap:14px}
.lk{display:flex;align-items:center;gap:14px;padding:12px 16px;border:1px solid #e6e9f0;border-radius:16px;background:#fff;color:#000;text-decoration:none;box-shadow:0 2px 10px rgba(20,40,90,.05);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s;will-change:transform;backface-visibility:hidden}
.lk:hover,.lk:focus-visible{transform:translateY(-2px);box-shadow:0 8px 22px rgba(29,111,242,.18);border-color:var(--blue);outline:none}
.ic{width:44px;height:44px;border-radius:12px;transition:transform .3s cubic-bezier(.2,.8,.2,1);display:grid;place-items:center;color:#fff;font-weight:700;font-size:.95rem;flex:none;overflow:hidden}
.ic img{width:100%;height:100%;object-fit:cover}
.lk b{flex:1;font-size:1rem;text-align:left;font-weight:600}
.lk i{color:var(--blue);font-style:normal;font-size:1.3rem;transition:transform .25s}

.ic{position:relative}.ic::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(0,0,0,.07);pointer-events:none}
.ic svg{width:24px;height:24px}
.lk{position:relative;overflow:hidden;animation:up .55s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*80ms)}
.lk::after{content:"";position:absolute;top:0;left:0;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(29,155,240,.14),transparent);transform:translateX(-160%) skewX(-20deg);transition:transform .8s cubic-bezier(.2,.7,.2,1);will-change:transform;pointer-events:none}
.lk:hover::after{transform:translateX(360%) skewX(-20deg)}.lk:hover .ic{transform:scale(1.1)}.lk:active .ic{transform:scale(.92)}.lk:hover i{transform:translateX(4px)}.lk:active{transform:scale(.98)}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#0b1b2e;color:#fff;padding:10px 16px;border-radius:12px;font-size:.9rem;opacity:0;pointer-events:none;transition:.3s;z-index:20}#toast.on{opacity:1;transform:translate(-50%,0)}
.rp{will-change:transform,opacity;position:absolute;border-radius:50%;background:rgba(29,155,240,.22);transform:scale(0);animation:rp .65s ease-out forwards;pointer-events:none}@keyframes rp{to{transform:scale(1);opacity:0}}
#sw{display:flex;gap:8px;margin:0 0 10px;flex-wrap:wrap}#sw[hidden]{display:none}#sw button{width:28px;height:28px;border-radius:50%;border:0;cursor:pointer;outline-offset:2px;padding:0}
.empty{color:#000;opacity:.5;padding:20px}
footer{padding:18px 0 22px;text-align:center}.dev{font-size:.7rem;color:var(--blue);margin-top:2px;letter-spacing:.03em}
footer button{background:none;border:0;font:inherit;font-size:.85rem;color:#000;opacity:.55;cursor:pointer}
footer button:hover{opacity:1}
#admin{position:fixed;inset:0;background:rgba(10,20,40,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9}
#admin[hidden]{display:none}
.panel{background:#fff;width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:20px}
@media(min-width:560px){#admin{align-items:center}.panel{border-radius:20px}}
.panel h2{margin:0 0 14px;font-size:1.15rem;display:flex;justify-content:space-between;align-items:center}
.panel input,.panel select{width:100%;padding:11px 12px;margin:0 0 10px;border:1px solid #d5dae5;border-radius:10px;font:inherit;background:#fff;color:#000}
.btn{padding:10px 16px;border:0;border-radius:10px;background:var(--blue);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn.g{background:#eef1f7;color:#000}.btn.r{background:#fde8e8;color:#c62828}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #eef0f5}
.row span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.row .btn{padding:6px 10px;font-size:.85rem}
.msg{font-size:.85rem;margin:6px 0;min-height:1.2em;color:var(--blue)}
.msg.e{color:#c62828}
@media(prefers-reduced-motion:reduce){.av .ld{animation:none}.lk{transition:none;animation:none}.lk::after{display:none}.ic,.lk i{transition:none}.rp{display:none}}
</style>
</head>
